<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purple Circle Game</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: Arial, sans-serif; }
canvas { display: block; width: 100vw; height: 100vh; background: #000; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
function setSize() { canvas.width = window.innerWidth || 800; canvas.height = window.innerHeight || 600; }
setSize();
window.addEventListener("resize", setSize);

const mouse = { x: canvas.width / 2, y: canvas.height / 2 };
window.addEventListener("mousemove", function(e) {
  const rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
});

const player = { x: canvas.width / 2, y: canvas.height / 2, radius: 25, baseSpeed: 260, speed: 260, color: "#9b30ff" };
const keys = { w: false, a: false, s: false, d: false };

let health = 100, maxHealth = 100;
let enemies = [], enemyBullets = [], projectiles = [], smokeBombs = [], fireOrbs = [];
let iceSpikes = [], blizzardFields = [], meleeSlashes = [], bombExplosions = [], landMines = [];
let buhBullets = [], buhShrines = [], shrineSlashFx = [], grassShards = [], grassFields = [];
let hunterBullets = [];
let hunterExplosions = [];
let hunterFZone = null;
let icebergBeams = [], icebergWalls = [], icebergMinis = [];
let lavaPuddles = [], magmaShots = [], volcanoShots = [];
let lavaFCooldownTimer = 0, lavaGCooldownTimer = 0, volcanoFCooldownTimer = 0, volcanoGCooldownTimer = 0;
let lavaBallTimer = 0, lavaBallTickTimer = 0, lavaBallInvulnerable = false;
let raidCrateMessage = "";
let carterLightningTimer = 0, carterLightningTick = 0, carterAuraTimer = 0, carterAuraTick = 0, carterFCooldownTimer = 0, carterGCooldownTimer = 0;
let lightningBolts = [], lightningStrikes = [], mechanicClaws = [], kaiOrbs = [], kaiFields = [], particleFx = [], starfield = [];
let enemySpawnTimer = 0;
const enemySpawnInterval = 1.5;
let lastTime = performance.now();
let bgTime = 0;

let inHome = true, homeT = 0, homeBalls = [], homeFx = [];

let cutscene = null;
let screenShake = 0;

let gachaState = "idle";
let gachaTimer = 0;
let gachaResult = null;

let bossesDefeated = 0;

for (let i = 0; i < 120; i++) {
  starfield.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, r: Math.random() * 1.6 + 0.3, a: Math.random() * 0.5 + 0.2, tw: Math.random() * Math.PI * 2 });
}

let isPaused = false, currentScreen = "game";
let isRaidMode = false; // Raid rules are local until a shared online server is connected.
let normalWave = 1, raidWave = 1;
let currentWave = 1, enemiesKilledCurrentWave = 0, enemiesSpawnedCurrentWave = 0, enemiesToSpawnThisWave = 0, tanksSpawnedCurrentWave = 0;
let totalKills = 0;
const MAX_ACTIVE_ENEMIES_ON_SCREEN = 8;

let equippedElement = "sand";
let unlockedElements = { sand: true, smoke: false, flame: false, blizzard: false, bomb: false, buh: false, grass: false, lightning: false, mechanic: false, kai: false, polar: false, hunter: false, nickson: false, iceberg: false, carter: false, lava: false, volcano: false };
let lastRollResult = "", money = 0, raidCoins = 0, nextEnemyId = 1;

const SAVE_KEY = "purple_circle_persistent_save";
const SAVE_BACKUP_KEY = "purple_circle_persistent_save_backup";
let saveStorageAvailable = false;

function readSavedData() {
  // Read both entries before choosing a save, so a higher normal wave in the
  // backup can be recovered from older versions that accidentally saved raid wave 1.
  const candidates = [];
  for (const key of [SAVE_KEY, SAVE_BACKUP_KEY]) {
    try {
      const raw = window.localStorage.getItem(key);
      if (!raw) continue;
      const data = JSON.parse(raw);
      if (data && typeof data === "object") candidates.push(data);
    } catch (e) {
      // Leave damaged entries untouched in case recovery is possible later.
    }
  }
  if (candidates.length) {
    saveStorageAvailable = true;
    const primary = candidates[0];
    const savedNormalWave = Math.max(1, ...candidates.map(d =>
      typeof d.normalWave === "number" && d.normalWave >= 1 ? d.normalWave :
      (typeof d.currentWave === "number" && d.currentWave >= 1 ? d.currentWave : 1)
    ));
    primary.normalWave = savedNormalWave;
    primary.currentWave = savedNormalWave;
    primary.raidWave = Math.max(1, ...candidates.map(d => typeof d.raidWave === "number" && d.raidWave >= 1 ? d.raidWave : 1));
    primary.maxHealth = Math.max(100, ...candidates.map(d => typeof d.maxHealth === "number" && d.maxHealth >= 100 ? d.maxHealth : 100));
    primary.totalKills = Math.max(0, ...candidates.map(d => typeof d.totalKills === "number" && d.totalKills >= 0 ? d.totalKills : 0));
    primary.bossesDefeated = Math.max(0, ...candidates.map(d => typeof d.bossesDefeated === "number" && d.bossesDefeated >= 0 ? d.bossesDefeated : 0));
    primary.unlockedElements = Object.assign({}, ...candidates.map(d => d.unlockedElements || {}));
    for (const d of candidates) {
      for (const key of Object.keys(d.unlockedElements || {})) {
        if (d.unlockedElements[key] === true) primary.unlockedElements[key] = true;
      }
    }
    return primary;
  }
  try {
    const testKey = "purple_circle_save_test";
    window.localStorage.setItem(testKey, "1");
    window.localStorage.removeItem(testKey);
    saveStorageAvailable = true;
  } catch (e) { saveStorageAvailable = false; }
  return null;
}

try {
  const data = readSavedData();
  if (data) {
    money = typeof data.money === "number" ? data.money : 0;
    raidCoins = typeof data.raidCoins === "number" ? Math.max(0, data.raidCoins) : 0;
    maxHealth = typeof data.maxHealth === "number" ? data.maxHealth : 100;
    equippedElement = typeof data.equippedElement === "string" ? data.equippedElement : "sand";
    totalKills = typeof data.totalKills === "number" ? data.totalKills : 0;
    bossesDefeated = typeof data.bossesDefeated === "number" ? data.bossesDefeated : 0;
    if (data.unlockedElements && typeof data.unlockedElements === "object") {
      for (const key of Object.keys(unlockedElements)) {
        if (key === "sand") unlockedElements.sand = true;
        else if (data.unlockedElements[key] === true) unlockedElements[key] = true;
      }
    }
    normalWave = typeof data.normalWave === "number" && data.normalWave >= 1 ? data.normalWave : (typeof data.currentWave === "number" && data.currentWave >= 1 ? data.currentWave : 1);
    raidWave = typeof data.raidWave === "number" && data.raidWave >= 1 ? data.raidWave : 1;
    currentWave = normalWave;
  }
} catch (e) { /* Keep the game playable if browser storage is unavailable. */ }

health = maxHealth;

function saveGameData() {
  const snapshot = JSON.stringify({
    version: 5, savedAt: Date.now(), money: money, raidCoins: raidCoins, maxHealth: maxHealth,
    equippedElement: equippedElement, unlockedElements: unlockedElements,
    // Keep normal and raid progress separate. Legacy currentWave always means normal mode.
    currentWave: isRaidMode ? normalWave : currentWave,
    normalWave: isRaidMode ? normalWave : currentWave,
    raidWave: isRaidMode ? currentWave : raidWave,
    totalKills: totalKills, bossesDefeated: bossesDefeated
  });
  try {
    const previous = window.localStorage.getItem(SAVE_KEY);
    if (previous) window.localStorage.setItem(SAVE_BACKUP_KEY, previous);
    window.localStorage.setItem(SAVE_KEY, snapshot);
    saveStorageAvailable = true;
  } catch (e) {
    saveStorageAvailable = false;
  }
}

// Autosave regularly and whenever the player leaves, hides, or closes the page.
window.addEventListener("beforeunload", saveGameData);
window.addEventListener("pagehide", saveGameData);
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "hidden") saveGameData();
});
setInterval(saveGameData, 5000);

function getKillsRequiredForWave(wave) { return 5 + (wave - 1) * 2; }
function isBossWave(wave) { return wave % 5 === 0; }
function getMoneyPerKill() { return currentWave >= 35 ? 200 : 1 + Math.floor((currentWave - 1) / 3) + 25 * Math.floor(currentWave / 10); }
function getBossHp() { return 1000 + bossesDefeated * 500; }

let beamCooldownTimer = 0, activeLaser = null;
let auraCooldownTimer = 0, auraActiveTimer = 0, auraDamageTickTimer = 0;
let smokeShotCooldownTimer = 0, smokeDashCooldownTimer = 0, smokeDashActiveTimer = 0, smokeBombSpawnTimer = 0;
let flameSpinActiveTimer = 0, flameSpinCooldownTimer = 0, flameSpinAngle = 0, flameSpinTickTimer = 0;
let flameOrbCooldownTimer = 0;
let iceSpikeCooldownTimer = 0, blizzardFieldCooldownTimer = 0;
let meleeCooldownTimer = 0;
let bombMiniCooldownTimer = 0, bombBigCooldownTimer = 0;
let buhBarrageCooldownTimer = 0, buhShrineCooldownTimer = 0;
let grassShotCooldownTimer = 0, grassFieldCooldownTimer = 0;
let lightningBoltCooldownTimer = 0, lightningStormCooldownTimer = 0;
let mechanicClawCooldownTimer = 0, mechanicSpinCooldownTimer = 0, mechanicSpinActiveTimer = 0, mechanicSpinTickTimer = 0, mechanicSpinAngle = 0;
let kaiOrbCooldownTimer = 0, kaiFieldCooldownTimer = 0;
let hunterSpaceCooldownTimer = 0, hunterGCooldownTimer = 0, hunterFCooldownTimer = 0, hunterFWaveTimer = 0, hunterFWavesLeft = 0;
let polarFrostCooldownTimer = 0, polarFrostActiveTimer = 0, polarFrostTickTimer = 0;
let polarSpinCooldownTimer = 0, polarSpinActiveTimer = 0, polarSpinTickTimer = 0, polarSpinAngle = 0;
let icebergMeleeCooldownTimer = 0, icebergGCooldownTimer = 0, icebergFCooldownTimer = 0, icebergStormTimer = 0, icebergStormTickTimer = 0;
let nicksonShockCooldownTimer = 0, nicksonGrowCooldownTimer = 0, nicksonGrowTimer = 0, nicksonSuctionTimer = 0, nicksonWaveTimer = 0, nicksonWaveRadius = 0;
let vBoostActiveTimer = 0, vBoostCooldownTimer = 0, vBoostMultiplier = 1;

function resetGame(skipSave, preserveWave) {
  if (!preserveWave) currentWave = 1;
  enemiesKilledCurrentWave = 0; enemiesSpawnedCurrentWave = 0;
  enemiesToSpawnThisWave = 0; health = maxHealth;
  enemies = []; enemyBullets = []; projectiles = []; smokeBombs = []; fireOrbs = [];
  iceSpikes = []; blizzardFields = []; meleeSlashes = []; bombExplosions = []; landMines = [];
  icebergBeams = []; icebergWalls = []; icebergMinis = [];
  lavaPuddles = []; magmaShots = []; volcanoShots = []; lavaFCooldownTimer = 0; lavaGCooldownTimer = 0; volcanoFCooldownTimer = 0; volcanoGCooldownTimer = 0; lavaBallTimer = 0; lavaBallTickTimer = 0; lavaBallInvulnerable = false;
  buhBullets = []; buhShrines = []; shrineSlashFx = []; grassShards = []; grassFields = [];
  lightningBolts = []; lightningStrikes = []; mechanicClaws = []; kaiOrbs = []; kaiFields = []; hunterBullets = []; hunterExplosions = []; hunterFZone = null; particleFx = [];
  beamCooldownTimer = 0; auraCooldownTimer = 0; auraActiveTimer = 0;
  smokeShotCooldownTimer = 0; smokeDashCooldownTimer = 0; smokeDashActiveTimer = 0;
  flameSpinActiveTimer = 0; flameSpinCooldownTimer = 0; flameOrbCooldownTimer = 0;
  iceSpikeCooldownTimer = 0; blizzardFieldCooldownTimer = 0; meleeCooldownTimer = 0;
  bombMiniCooldownTimer = 0; bombBigCooldownTimer = 0;
  buhBarrageCooldownTimer = 0; buhShrineCooldownTimer = 0;
  grassShotCooldownTimer = 0; grassFieldCooldownTimer = 0;
  lightningBoltCooldownTimer = 0; lightningStormCooldownTimer = 0;
  mechanicClawCooldownTimer = 0; mechanicSpinCooldownTimer = 0; mechanicSpinActiveTimer = 0;
  kaiOrbCooldownTimer = 0; kaiFieldCooldownTimer = 0;
  hunterSpaceCooldownTimer = 0; hunterGCooldownTimer = 0; hunterFCooldownTimer = 0; hunterFWaveTimer = 0; hunterFWavesLeft = 0; hunterExplosions = []; hunterFZone = null;
  polarFrostCooldownTimer = 0; polarFrostActiveTimer = 0; polarFrostTickTimer = 0;
  polarSpinCooldownTimer = 0; polarSpinActiveTimer = 0; polarSpinTickTimer = 0; polarSpinAngle = 0;
  icebergMeleeCooldownTimer = 0; icebergGCooldownTimer = 0; icebergFCooldownTimer = 0; icebergStormTimer = 0; icebergStormTickTimer = 0;
  carterLightningTimer = 0; carterLightningTick = 0; carterAuraTimer = 0; carterAuraTick = 0; carterFCooldownTimer = 0; carterGCooldownTimer = 0;
  nicksonShockCooldownTimer = 0; nicksonGrowCooldownTimer = 0; nicksonGrowTimer = 0; nicksonSuctionTimer = 0; nicksonWaveTimer = 0; nicksonWaveRadius = 0;
  vBoostActiveTimer = 0; vBoostCooldownTimer = 0; vBoostMultiplier = 1;
  activeLaser = null;
  isPaused = false; currentScreen = "game";
  player.x = canvas.width / 2; player.y = canvas.height / 2;
  player.speed = player.baseSpeed;
  if (!skipSave) saveGameData();
}

function goToLobby() {
  resetGame(true, true);
  inHome = true;
  homeBalls = [];
  homeFx = [];
  homeT = 0;
  cutscene = null;
  screenShake = 0;
  saveGameData();
}

function startCutscene(type, duration, data) {
  cutscene = { type: type, timer: duration, maxTimer: duration, data: data || {} };
}

function startWave() {
  enemiesKilledCurrentWave = 0; enemiesSpawnedCurrentWave = 0; tanksSpawnedCurrentWave = 0;
  enemiesToSpawnThisWave = getKillsRequiredForWave(currentWave) + (currentWave >= 20 ? 5 : 0);
  if (isBossWave(currentWave)) {
    enemiesToSpawnThisWave += 1;
    startCutscene("bossIntro", 2.2, { bossNum: bossesDefeated + 1 });
    screenShake = 1.0;
  }
}

function spawnEnemy() {
  if (enemiesSpawnedCurrentWave >= enemiesToSpawnThisWave) return;
  if (enemies.length >= MAX_ACTIVE_ENEMIES_ON_SCREEN) return;
  const rand = Math.random();
  let type = "normal", radius = 12, speed = 110, damage = 25;
  let hp = 100 + (currentWave - 1) * 25, color = "#ff3333";
  let isBoss = false, isTank = false, isRusher = false;
  if (isBossWave(currentWave) && !enemies.some(function(e){ return e.isBoss; }) && enemiesSpawnedCurrentWave === 0) {
    isBoss = true; type = "boss"; radius = 40; speed = 60; damage = 40; hp = getBossHp(); color = "#a020f0";
  } else if (currentWave >= 20 && tanksSpawnedCurrentWave < 5) {
    isTank = true; type = "tank"; radius = 22; speed = 70; damage = 35;
    hp = 4000; color = "#3ea663";
  } else if (currentWave >= 5 && rand < 0.15) {
    isTank = true; type = "tank"; radius = 22; speed = 70; damage = 35;
    hp = 300 + (currentWave - 5) * 20; color = "#3ea663";
  } else if (currentWave >= 4 && rand < 0.32) {
    isRusher = true; type = "rusher"; radius = 14; speed = 160; damage = 30;
    hp = 180 + (currentWave - 4) * 18; color = "#dd44dd";
  } else if (currentWave >= 2 && rand < 0.6) {
    type = "fast"; radius = 9; speed = 200; damage = 20;
    hp = 70 + (currentWave - 1) * 12; color = "#ff9900";
  }
  if (isRaidMode) hp *= 10;
  let elementalAura = null;
  if (!isBoss && currentWave > 5 && Math.random() < 0.22) {
    const auras = [
      { key: "sand", color: "#e5c15a" }, { key: "smoke", color: "#b8dce8" },
      { key: "flame", color: "#ff542e" }, { key: "bomb", color: "#ffcc00" },
      { key: "grass", color: "#65e36b" }, { key: "lightning", color: "#bd7bff" },
      { key: "mechanic", color: "#c2ccd8" }
    ];
    elementalAura = auras[Math.floor(Math.random() * auras.length)];
    damage = 6;
  }
  let x, y;
  if (Math.random() < 0.5) { x = Math.random() < 0.5 ? -radius : canvas.width + radius; y = Math.random() * canvas.height; }
  else { x = Math.random() * canvas.width; y = Math.random() < 0.5 ? -radius : canvas.height + radius; }
  enemies.push({
    id: nextEnemyId++, type: type, isBoss: isBoss, isTank: isTank, isRusher: isRusher,
    x: x, y: y, radius: radius, speed: speed, baseSpeed: speed,
    color: color, damage: damage, elementalAura: elementalAura,
    maxHealth: hp, health: hp, hitCooldown: 0, freezeTimer: 0,
    shootTimer: isBoss ? 1.5 : 0, dashTimer: isRusher ? 2.0 : 0, dashing: false,
    pulsePhase: Math.random() * Math.PI * 2
  });
  enemiesSpawnedCurrentWave++;
  if (isTank && currentWave >= 20) tanksSpawnedCurrentWave++;
}

function onEnemyKilled(enemy) {
  enemiesKilledCurrentWave++;
  totalKills++;
  money += getMoneyPerKill();
  raidCoins += 10;
  if (enemy && enemy.isBoss) {
    bossesDefeated++;
    startCutscene("bossDefeated", 1.8, {});
    screenShake = 0.8;
  }
  saveGameData();
  if (enemiesKilledCurrentWave >= getKillsRequiredForWave(currentWave)) {
    currentWave++;
    if (isRaidMode) raidWave = currentWave; else normalWave = currentWave;
    startWave();
    saveGameData();
  }
}

function spawnParticles(x, y, count, color, speed, life, size) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = speed * (0.4 + Math.random() * 0.8);
    particleFx.push({
      x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: life * (0.7 + Math.random() * 0.6), maxLife: life,
      color: color, size: size * (0.5 + Math.random() * 0.8)
    });
  }
}

function useVBoost() {
  if (isPaused || cutscene) return;
  if (vBoostCooldownTimer > 0) return;
  if (totalKills < 50) return;
  if (totalKills >= 100) {
    vBoostActiveTimer = 5.0; vBoostMultiplier = 3.0; vBoostCooldownTimer = 8.0;
    if (equippedElement === "sand") { beamCooldownTimer = 0; auraCooldownTimer = 0; }
    else if (equippedElement === "smoke") { smokeShotCooldownTimer = 0; smokeDashCooldownTimer = 0; }
    else if (equippedElement === "flame") { flameSpinCooldownTimer = 0; flameOrbCooldownTimer = 0; }
    else if (equippedElement === "blizzard") { iceSpikeCooldownTimer = 0; blizzardFieldCooldownTimer = 0; }
    else if (equippedElement === "bomb") { bombMiniCooldownTimer = 0; bombBigCooldownTimer = 0; }
    else if (equippedElement === "buh") { buhBarrageCooldownTimer = 0; buhShrineCooldownTimer = 0; }
    else if (equippedElement === "grass") { grassShotCooldownTimer = 0; grassFieldCooldownTimer = 0; }
    else if (equippedElement === "lightning") { lightningBoltCooldownTimer = 0; lightningStormCooldownTimer = 0; }
    else if (equippedElement === "mechanic") { mechanicClawCooldownTimer = 0; mechanicSpinCooldownTimer = 0; mechanicSpinActiveTimer = 0; }
    else if (equippedElement === "kai") { kaiOrbCooldownTimer = 0; kaiFieldCooldownTimer = 0;
  hunterSpaceCooldownTimer = 0; hunterGCooldownTimer = 0; hunterFCooldownTimer = 0; hunterFWaveTimer = 0; hunterFWavesLeft = 0; }
    else if (equippedElement === "polar") { polarFrostCooldownTimer = 0; polarSpinCooldownTimer = 0; }
    else if (equippedElement === "iceberg") { icebergMeleeCooldownTimer = 0; icebergGCooldownTimer = 0; icebergFCooldownTimer = 0; }
    else if (equippedElement === "hunter") { hunterGCooldownTimer = 0; hunterFCooldownTimer = 0; hunterSpaceCooldownTimer = 0; }
    spawnParticles(player.x, player.y, 40, "#00ffff", 320, 0.7, 5);
  } else {
    vBoostActiveTimer = 4.0; vBoostMultiplier = 2.0; vBoostCooldownTimer = 6.0;
    spawnParticles(player.x, player.y, 25, "#ffee55", 250, 0.6, 4);
  }
}

function useMelee() {
  if (isPaused || cutscene || equippedElement === "carter") return;
  if (equippedElement === "hunter") {
    if (hunterSpaceCooldownTimer > 0) return;
    // SPACE is manually aimed at the mouse; the round explodes on contact in an AoE.
    const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    const muzzleX = player.x + Math.cos(angle) * (player.radius + 32);
    const muzzleY = player.y + Math.sin(angle) * (player.radius + 32);
    hunterBullets.push({ x: muzzleX, y: muzzleY, vx: Math.cos(angle), vy: Math.sin(angle), targetId: null, speed: 760, radius: 10, damage: 2000, splashRadius: 115, color: "#f2b66d", life: 2.2 });
    hunterSpaceCooldownTimer = 2;
    return;
  }
  if (equippedElement === "iceberg") {
    if (icebergMeleeCooldownTimer > 0) return;
    const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    const beam = { angle, duration: 3.0, tickTimer: 0.5, hitIds: new Set() };
    icebergBeams.push(beam);
    // The first impact deals 2,000 damage; the sustained beam adds 300 every 0.5 seconds.
    damageIcebergBeam(beam, 2000);
    icebergMeleeCooldownTimer = 4.0;
    return;
  }
  if (meleeCooldownTimer > 0) return;
  const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
  const configs = {
    flame:    { reach: 110, arc: Math.PI * 0.7,  dmg: 150, cd: 1.0, color: "rgba(255, 100, 0, 0.85)", inner: "#ffff00", parts: "#ffcc44" },
    blizzard: { reach: 200, arc: Math.PI * 0.6,  dmg: 120, cd: 0.5, color: "rgba(120, 200, 255, 0.85)", inner: "#e6f6ff", parts: "#aee4ff", freeze: 1.5 },
    bomb:     { reach: 90,  arc: Math.PI * 0.8,  dmg: 90,  cd: 0.6, color: "rgba(80, 80, 80, 0.85)", inner: "#ffcc00", parts: "#ffcc00" },
    buh:      { reach: 160, arc: Math.PI * 0.85, dmg: 200, cd: 0.7, color: "rgba(255, 0, 80, 0.85)", inner: "#ffccff", parts: "#ff66aa" },
    grass:    { reach: 130, arc: Math.PI * 0.75, dmg: 110, cd: 0.7, color: "rgba(80, 200, 80, 0.85)", inner: "#d0ffb0", parts: "#90ee90" },
    lightning:{ reach: 170, arc: Math.PI * 0.7,  dmg: 180, cd: 0.55, color: "rgba(180, 100, 255, 0.9)", inner: "#e0ccff", parts: "#d0a0ff" },
    mechanic: { reach: 190, arc: Math.PI * 0.65, dmg: 220, cd: 0.6, color: "rgba(150, 160, 180, 0.9)", inner: "#d0d8e0", parts: "#c0c8d0" },
    kai:      { reach: 140, arc: Math.PI * 0.8,  dmg: 120, cd: 0.65, color: "rgba(200, 80, 220, 0.85)", inner: "#f0c0ff", parts: "#e080ff" },
    polar:    { reach: 220, arc: Math.PI * 0.75, dmg: 350, cd: 0.45, color: "rgba(185, 244, 255, 0.9)", inner: "#ffffff", parts: "#b9f4ff" }
  };
  const cfg = configs[equippedElement];
  if (!cfg) { meleeCooldownTimer = 0.5; return; }
  meleeSlashes.push({ x: player.x, y: player.y, angle: angle, reach: cfg.reach, arc: cfg.arc, life: 0.28, maxLife: 0.28, color: cfg.color, colorInner: cfg.inner });
  for (let i = enemies.length - 1; i >= 0; i--) {
    const enemy = enemies[i];
    const dx = enemy.x - player.x, dy = enemy.y - player.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist <= cfg.reach + enemy.radius) {
      let d = Math.atan2(dy, dx) - angle;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      if (Math.abs(d) <= cfg.arc / 2) {
        enemy.health -= cfg.dmg;
        if (cfg.freeze) enemy.freezeTimer = Math.max(enemy.freezeTimer, cfg.freeze);
        spawnParticles(enemy.x, enemy.y, 6, cfg.parts, 130, 0.4, 3);
        if (enemy.health <= 0) { const isB = enemy.isBoss; enemies.splice(i, 1); onEnemyKilled({ isBoss: isB }); }

function damageIcebergBeam(beam, damage) {
  const dx = Math.cos(beam.angle), dy = Math.sin(beam.angle);
  const maxLen = Math.hypot(canvas.width, canvas.height) * 1.5;
  for (let i = enemies.length - 1; i >= 0; i--) {
    const enemy = enemies[i];
    const ex = enemy.x - player.x, ey = enemy.y - player.y;
    const along = ex * dx + ey * dy;
    const across = Math.abs(ex * dy - ey * dx);
    if (along >= 0 && along <= maxLen && across <= 34 + enemy.radius) {
      enemy.health -= damage;
      spawnParticles(enemy.x, enemy.y, 5, "#bff8ff", 190, 0.35, 4);
      if (enemy.health <= 0) { const isB = enemy.isBoss; enemies.splice(i, 1); onEnemyKilled({ isBoss: isB }); }
    }
  }
}

function applyExplosionDamage(x, y, radius, damage) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const enemy = enemies[i];
    if (Math.hypot(x - enemy.x, y - enemy.y) <= radius + enemy.radius) {
      enemy.health -= damage;
      if (enemy.health <= 0) { const isB = enemy.isBoss; enemies.splice(i, 1); onEnemyKilled({ isBoss: isB }); }
    }
  }
}

function nearestEnemyTo(x, y) {
  let best = null, bestD = Infinity;
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    const d = (e.x - x) * (e.x - x) + (e.y - y) * (e.y - y);
    if (d < bestD) { bestD = d; best = e; }
  }
  return best;
}

      }
    }
    if (orb.damageDealt >= orb.maxDamage || orb.duration <= 0) fireOrbs.splice(i, 1);
  }

  enemySpawnTimer += deltaTime;
  if (enemySpawnTimer >= enemySpawnInterval) { spawnEnemy(); enemySpawnTimer = 0; }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const enemy = enemies[i];
    if (enemy.freezeTimer > 0) { enemy.freezeTimer = Math.max(0, enemy.freezeTimer - deltaTime); enemy.speed = enemy.baseSpeed * 0.4; }
    else enemy.speed = enemy.baseSpeed;

    if (enemy.isRusher) {
      enemy.dashTimer -= deltaTime;
      if (enemy.dashTimer <= 0 && !enemy.dashing) { enemy.dashing = true; enemy.dashDuration = 0.7; enemy.dashTimer = 3.0; }
      if (enemy.dashing) { enemy.dashDuration -= deltaTime; if (enemy.dashDuration <= 0) enemy.dashing = false; }
    }

    const dx = player.x - enemy.x;
    const dy = player.y - enemy.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const curSpeed = enemy.dashing ? enemy.speed * 2.6 : enemy.speed;
    const suctionBoost = nicksonSuctionTimer > 0 ? 300 : 0;
    if (dist > 0) {
      enemy.x += (dx / dist) * (curSpeed + suctionBoost) * deltaTime;
      enemy.y += (dy / dist) * (curSpeed + suctionBoost) * deltaTime;
    }
    if (enemy.dashing) spawnParticles(enemy.x, enemy.y, 1, "#ff88ff", 30, 0.3, 3);
    if (enemy.isBoss) {
      enemy.shootTimer -= deltaTime;
      if (enemy.shootTimer <= 0) {
        enemy.shootTimer = 1.8;
        const a = Math.atan2(player.y - enemy.y, player.x - enemy.x);
        for (let s = -1; s <= 1; s++) {
          const spread = a + s * 0.25;
          enemyBullets.push({ x: enemy.x, y: enemy.y, vx: Math.cos(spread) * 220, vy: Math.sin(spread) * 220, radius: 10, damage: 30, color: "#cc44ff" });
        }
      }
    }
    if (equippedElement === "sand" && auraActiveTimer > 0 && applyAuraDamage) {
      if (dist <= 120 + enemy.radius) {
        enemy.health -= 25;
        spawnParticles(enemy.x, enemy.y, 4, "#ffd166", 100, 0.4, 3);
        if (enemy.health <= 0) { const isB = enemy.isBoss; enemies.splice(i, 1); onEnemyKilled({ isBoss: isB }); continue; }
      }
    }
    if (enemy.hitCooldown > 0) enemy.hitCooldown -= deltaTime;
    if (!lavaBallInvulnerable && dist < player.radius + enemy.radius) {
      if (enemy.hitCooldown <= 0) {
        health -= enemy.damage;
        enemy.hitCooldown = 0.5;
        spawnParticles(player.x, player.y, 6, "#ff5555", 150, 0.35, 3);
        if (health <= 0) { startCutscene("death", 2.0, {}); return; }
      }
    }
  }
}

function drawBackground() {
  if (isRaidMode) {
    const W = canvas.width, H = canvas.height;
    const base = ctx.createLinearGradient(0, 0, W, H);
    base.addColorStop(0, "#17152d"); base.addColorStop(.48, "#292044"); base.addColorStop(1, "#0d172b");
    ctx.fillStyle = base; ctx.fillRect(0, 0, W, H);
    // Deep violet / indigo molten ground: deliberately different from Lava orange and Volcano red.
    for (let i = 0; i < 7; i++) {
      const x = W * (i / 6) + Math.sin(bgTime * .28 + i * 1.7) * 35;
      ctx.strokeStyle = i % 2 ? "rgba(116,105,205,.30)" : "rgba(77,151,190,.24)";
      ctx.lineWidth = 2 + (i % 3);
      ctx.beginPath(); ctx.moveTo(x, 0);
      let y = 0;
      while (y < H) { y += 34 + ((i * 11 + Math.floor(y)) % 25); ctx.lineTo(x + Math.sin(y * .023 + i + bgTime * .3) * 22, Math.min(y, H)); }
      ctx.stroke();
    }
    for (let i = 0; i < 9; i++) {
      const x = ((i * 137 + bgTime * (9 + i % 3)) % (W + 80)) - 40;
      const y = ((i * 83 + Math.sin(bgTime * .2 + i) * 30) % (H + 80)) - 40;
      const glow = ctx.createRadialGradient(x, y, 0, x, y, 90 + (i % 3) * 25);
      glow.addColorStop(0, "rgba(103,105,206,.13)"); glow.addColorStop(1, "rgba(103,105,206,0)");
      ctx.fillStyle = glow; ctx.fillRect(x - 120, y - 120, 240, 240);
    }
    // Fortress silhouette around the map perimeter: thick stone ramparts and corner towers.
    const inset = 15, wall = 23, tower = 42;
    ctx.save();
    ctx.shadowColor = "rgba(105,147,197,.45)"; ctx.shadowBlur = 12;
    ctx.fillStyle = "#222b42"; ctx.strokeStyle = "#7c91b3"; ctx.lineWidth = 3;
    ctx.fillRect(inset, inset, W - inset * 2, wall); ctx.strokeRect(inset, inset, W - inset * 2, wall);
    ctx.fillRect(inset, H - inset - wall, W - inset * 2, wall); ctx.strokeRect(inset, H - inset - wall, W - inset * 2, wall);
    ctx.fillRect(inset, inset, wall, H - inset * 2); ctx.strokeRect(inset, inset, wall, H - inset * 2);
    ctx.fillRect(W - inset - wall, inset, wall, H - inset * 2); ctx.strokeRect(W - inset - wall, inset, wall, H - inset * 2);
    ctx.fillStyle = "#35425e"; ctx.strokeStyle = "#a6b4cf";
    const towers = [[inset, inset], [W - inset - tower, inset], [inset, H - inset - tower], [W - inset - tower, H - inset - tower]];
    for (const t of towers) { ctx.fillRect(t[0], t[1], tower, tower); ctx.strokeRect(t[0], t[1], tower, tower); }
    // Crenellations along each wall make the border read as a fortress rather than a plain frame.
    ctx.fillStyle = "#53627e";
    for (let x = inset + tower; x < W - inset - tower; x += 36) {
      ctx.fillRect(x, inset - 3, 18, 8); ctx.fillRect(x, H - inset - wall - 5, 18, 8);
    }
    for (let y = inset + tower; y < H - inset - tower; y += 36) {
      ctx.fillRect(inset - 3, y, 8, 18); ctx.fillRect(W - inset - wall - 5, y, 8, 18);
    }
    ctx.restore();
    return;
  }
  const g = ctx.createRadialGradient(canvas.width * 0.5, canvas.height * 0.5, 0, canvas.width * 0.5, canvas.height * 0.5, Math.max(canvas.width, canvas.height) * 0.8);
  g.addColorStop(0, "#0b0a1f"); g.addColorStop(0.5, "#050414"); g.addColorStop(1, "#000000");
  ctx.fillStyle = g; ctx.fillRect(0, 0, canvas.width, canvas.height);
  const t = bgTime * 0.15;
  for (let n = 0; n < 3; n++) {
    const px = canvas.width * (0.5 + 0.35 * Math.cos(t + n * 2.1));
    const py = canvas.height * (0.5 + 0.35 * Math.sin(t * 1.2 + n * 1.7));
    const radius = Math.max(canvas.width, canvas.height) * 0.45;
    const ng = ctx.createRadialGradient(px, py, 0, px, py, radius);
    if (n === 0) { ng.addColorStop(0, "rgba(120, 60, 200, 0.10)"); ng.addColorStop(1, "rgba(120, 60, 200, 0)"); }
    else if (n === 1) { ng.addColorStop(0, "rgba(60, 120, 200, 0.08)"); ng.addColorStop(1, "rgba(60, 120, 200, 0)"); }
    else { ng.addColorStop(0, "rgba(200, 40, 120, 0.06)"); ng.addColorStop(1, "rgba(200, 40, 120, 0)"); }
    ctx.fillStyle = ng; ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  ctx.strokeStyle = "rgba(90, 70, 140, 0.10)"; ctx.lineWidth = 1;
  const gs = 60;
  const ox = (bgTime * 8) % gs, oy = (bgTime * 8) % gs;
  for (let x = -ox; x < canvas.width; x += gs) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
  for (let y = -oy; y < canvas.height; y += gs) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }
  for (const s of starfield) {
    const tw = 0.5 + 0.5 * Math.sin(bgTime * 2 + s.tw);
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(200, 190, 255, " + (s.a * tw).toFixed(3) + ")"; ctx.fill();
  }
  const vg = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, Math.min(canvas.width, canvas.height) * 0.35, canvas.width / 2, canvas.height / 2, Math.max(canvas.width, canvas.height) * 0.75);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,0.75)");
  ctx.fillStyle = vg; ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function drawEnemy(enemy) {
  const now = performance.now() / 1000;
  const pulse = 0.5 + 0.5 * Math.sin(now * 3 + (enemy.pulsePhase || 0));
  const frozen = enemy.freezeTimer > 0;
  let baseColor, glowColor;
  if (frozen) { baseColor = "#9fe4ff"; glowColor = "rgba(120, 220, 255, 0.85)"; }
  else if (enemy.isBoss) { baseColor = "#c060ff"; glowColor = "rgba(180, 80, 255, 0.9)"; }
  else if (enemy.isTank) { baseColor = "#3ea663"; glowColor = "rgba(80, 220, 130, 0.85)"; }
  else if (enemy.isRusher) { baseColor = "#dd44dd"; glowColor = "rgba(255, 100, 255, 0.9)"; }
  else if (enemy.type === "fast") { baseColor = "#ffaa33"; glowColor = "rgba(255, 170, 40, 0.85)"; }
  else { baseColor = "#ff4455"; glowColor = "rgba(255, 60, 80, 0.85)"; }
  const glowR = enemy.radius * (enemy.dashing ? 3.0 : 2.2);
  const og = ctx.createRadialGradient(enemy.x, enemy.y, enemy.radius * 0.5, enemy.x, enemy.y, glowR);
  og.addColorStop(0, glowColor); og.addColorStop(0.5, glowColor.replace(/[\d.]+\)$/, "0.25)")); og.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = og; ctx.beginPath(); ctx.arc(enemy.x, enemy.y, glowR, 0, Math.PI * 2); ctx.fill();
  const bg = ctx.createRadialGradient(enemy.x - enemy.radius * 0.3, enemy.y - enemy.radius * 0.3, enemy.radius * 0.1, enemy.x, enemy.y, enemy.radius);
  bg.addColorStop(0, "#ffffff"); bg.addColorStop(0.35, baseColor); bg.addColorStop(1, "#330000");
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = glowColor; ctx.lineWidth = enemy.isBoss ? 4 : (enemy.isTank ? 3.5 : (enemy.dashing ? 3 : 2));
  ctx.beginPath(); ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(enemy.x, enemy.y, enemy.radius * (0.35 + pulse * 0.15), 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255, 255, 255, " + (0.55 + pulse * 0.3).toFixed(2) + ")"; ctx.fill();
  if (enemy.isBoss) {
    ctx.strokeStyle = "#ffdd00"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(enemy.x, enemy.y, enemy.radius + 8, 0, Math.PI * 2); ctx.stroke();
    const ang = now * 1.5;
    for (let k = 0; k < 6; k++) {
      const a = ang + k * Math.PI / 3;
      ctx.beginPath(); ctx.arc(enemy.x + Math.cos(a) * (enemy.radius + 8), enemy.y + Math.sin(a) * (enemy.radius + 8), 3, 0, Math.PI * 2);
      ctx.fillStyle = "#ffdd00"; ctx.fill();
    }
  }
  if (enemy.isTank) {
    ctx.strokeStyle = "rgba(160, 220, 180, 0.9)"; ctx.lineWidth = 3;
    const seg = 6; const ang = now * 0.6;
    for (let k = 0; k < seg; k++) {
      const a0 = ang + (k / seg) * Math.PI * 2;
      ctx.beginPath(); ctx.arc(enemy.x, enemy.y, enemy.radius + 4, a0, a0 + (Math.PI * 2 / seg) * 0.5); ctx.stroke();
    }
  }
  if (enemy.isRusher) {
    ctx.fillStyle = "rgba(255, 150, 255, 0.85)";
    const ang = now * 3;
    for (let k = 0; k < 5; k++) {
      const a = ang + k * Math.PI * 2 / 5;
      const px = enemy.x + Math.cos(a) * (enemy.radius + 3);
      const py = enemy.y + Math.sin(a) * (enemy.radius + 3);
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(px + Math.cos(a + 0.4) * 5, py + Math.sin(a + 0.4) * 5);
      ctx.lineTo(px + Math.cos(a - 0.4) * 5, py + Math.sin(a - 0.4) * 5);
      ctx.closePath(); ctx.fill();
    }
  }
  if (enemy.type === "fast" && !frozen) {
    ctx.strokeStyle = "rgba(255, 170, 40, 0.55)"; ctx.lineWidth = 2;
    const ang = Math.atan2(player.y - enemy.y, player.x - enemy.x);
    for (let k = 0; k < 3; k++) {
      const off = (k - 1) * 4;
      const sx = enemy.x + Math.cos(ang + Math.PI / 2) * off;
      const sy = enemy.y + Math.sin(ang + Math.PI / 2) * off;
      ctx.beginPath(); ctx.moveTo(sx, sy);
      ctx.lineTo(sx - Math.cos(ang) * (12 + pulse * 4), sy - Math.sin(ang) * (12 + pulse * 4)); ctx.stroke();
    }
  }
  if (frozen) {
    ctx.fillStyle = "rgba(220, 245, 255, 0.95)";
    for (let k = 0; k < 4; k++) {
      const a = now * 2 + k * Math.PI / 2;
      ctx.beginPath(); ctx.arc(enemy.x + Math.cos(a) * (enemy.radius + 6), enemy.y + Math.sin(a) * (enemy.radius + 6), 1.6, 0, Math.PI * 2); ctx.fill();
    }
  }
  if (enemy.health < enemy.maxHealth) {
    const barW = enemy.isBoss ? 70 : (enemy.isTank ? 40 : (enemy.isRusher ? 32 : 26));
    const barH = enemy.isBoss ? 7 : (enemy.isTank ? 5 : 4);
    const bx = enemy.x - barW / 2;
    const by = enemy.y - enemy.radius - 12;
    ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.fillRect(bx - 1, by - 1, barW + 2, barH + 2);
    ctx.fillStyle = "#222"; ctx.fillRect(bx, by, barW, barH);
    let hpColor = "#ff3333";
    if (enemy.isBoss) hpColor = "#cc44ff";
    else if (enemy.isTank) hpColor = "#3ea663";
    else if (enemy.isRusher) hpColor = "#dd44dd";
    ctx.fillStyle = hpColor;
    ctx.fillRect(bx, by, (enemy.health / enemy.maxHealth) * barW, barH);
  }
}

function drawHome() {
  drawBackground();
  homeT += 0.016;
  if (homeBalls.length === 0) {
    const colors = ["#cca700", "#778899", "#ff4500", "#7ec8ff", "#aaaaaa", "#ff2288", "#4ec44e", "#c060ff", "#a0b0c0", "#d870ff"];
    const keys = ["sand", "smoke", "flame", "blizzard", "bomb", "buh", "grass", "lightning", "mechanic", "kai"];
    for (let i = 0; i < 10; i++) {
      homeBalls.push({ key: keys[i], color: colors[i], x: Math.random() * canvas.width, y: Math.random() * canvas.height, vx: (Math.random() - 0.5) * 60, vy: (Math.random() - 0.5) * 60, r: 20, cd: 0 });
    }
  }
  for (const b of homeBalls) {
    b.x += b.vx * 0.016; b.y += b.vy * 0.016;
    if (b.x < b.r + 20) { b.x = b.r + 20; b.vx *= -1; }
    if (b.x > canvas.width - b.r - 20) { b.x = canvas.width - b.r - 20; b.vx *= -1; }
    if (b.y < b.r + 20) { b.y = b.r + 20; b.vy *= -1; }
    if (b.y > canvas.height - b.r - 20) { b.y = canvas.height - b.r - 20; b.vy *= -1; }
    b.cd -= 0.016;
    if (b.cd <= 0) {
      b.cd = 0.6 + Math.random() * 0.6;
      const ang = Math.random() * Math.PI * 2;
      if (b.key === "sand") homeFx.push({ type: "beam", x: b.x, y: b.y, tx: b.x + Math.cos(ang) * 200, ty: b.y + Math.sin(ang) * 200, life: 0.3, maxLife: 0.3 });
      else if (b.key === "smoke") for (let i = 0; i < 4; i++) homeFx.push({ type: "smoke", x: b.x, y: b.y, vx: (Math.random() - 0.5) * 40, vy: (Math.random() - 0.5) * 40, life: 0.8, maxLife: 0.8, r: 20 + Math.random() * 20 });
      else if (b.key === "flame") homeFx.push({ type: "spin", x: b.x, y: b.y, life: 1.2, maxLife: 1.2, angle: Math.random() * Math.PI * 2 });
      else if (b.key === "blizzard") homeFx.push({ type: "ice", x: b.x, y: b.y, life: 0.8, maxLife: 0.8 });
      else if (b.key === "bomb") {
        homeFx.push({ type: "boom", x: b.x, y: b.y, life: 0.5, maxLife: 0.5, r: 70 });
        for (let i = 0; i < 8; i++) { const sa = Math.random() * Math.PI * 2; homeFx.push({ type: "spark", x: b.x, y: b.y, vx: Math.cos(sa) * 150, vy: Math.sin(sa) * 150, life: 0.5, maxLife: 0.5, color: "#ffcc44" }); }
      } else if (b.key === "buh") {
        for (let i = 0; i < 7; i++) { const sa = (Math.PI * 2 / 7) * i; homeFx.push({ type: "buh", x: b.x, y: b.y, vx: Math.cos(sa) * 220, vy: Math.sin(sa) * 220, life: 1.5, maxLife: 1.5 }); }
      } else if (b.key === "grass") {
        for (let i = 0; i < 3; i++) { const sa = ang + (i - 1) * 0.2; homeFx.push({ type: "grass", x: b.x, y: b.y, vx: Math.cos(sa) * 260, vy: Math.sin(sa) * 260, life: 1.2, maxLife: 1.2 }); }
      } else if (b.key === "lightning") {
        homeFx.push({ type: "bolt", x: b.x, y: b.y, tx: b.x + Math.cos(ang) * 250, ty: b.y + Math.sin(ang) * 250, life: 0.5, maxLife: 0.5 });
      } else if (b.key === "mechanic") {
        for (let i = 0; i < 6; i++) { const sa = ang + (i - 2.5) * 0.16; homeFx.push({ type: "claw", x: b.x, y: b.y, vx: Math.cos(sa) * 300, vy: Math.sin(sa) * 300, angle: sa, life: 1.0, maxLife: 1.0 }); }
      } else if (b.key === "kai") {
        for (let i = 0; i < 5; i++) { const sa = (Math.PI * 2 / 5) * i; homeFx.push({ type: "kai", x: b.x, y: b.y, vx: Math.cos(sa) * 240, vy: Math.sin(sa) * 240, life: 1.2, maxLife: 1.2 }); }
      }
    }
  }
  for (let i = homeFx.length - 1; i >= 0; i--) {
    const f = homeFx[i];
    f.life -= 0.016;
    if (f.type === "smoke" || f.type === "spark" || f.type === "buh" || f.type === "grass" || f.type === "claw" || f.type === "kai") {
      f.x += f.vx * 0.016; f.y += f.vy * 0.016;
      f.vx *= 0.96; f.vy *= 0.96;
    }
    if (f.type === "spin") f.angle += 0.016 * 12;
    if (f.life <= 0) homeFx.splice(i, 1);
  }
  for (const f of homeFx) {
    const a = f.life / f.maxLife;
    ctx.save(); ctx.globalAlpha = a;
    if (f.type === "beam") {
      const g = ctx.createLinearGradient(f.x, f.y, f.tx, f.ty);
      g.addColorStop(0, "#ffe066"); g.addColorStop(1, "rgba(255, 230, 130, 0)");
      ctx.strokeStyle = g; ctx.lineWidth = 8;
      ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(f.tx, f.ty); ctx.stroke();
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke();
    } else if (f.type === "smoke") {
      const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
      g.addColorStop(0, "rgba(200, 200, 200, 0.5)"); g.addColorStop(1, "rgba(120, 120, 120, 0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
    } else if (f.type === "spin") {
      const len = 120;
      const l1x = f.x + Math.cos(f.angle) * len, l1y = f.y + Math.sin(f.angle) * len;
      const l2x = f.x + Math.cos(f.angle + Math.PI) * len, l2y = f.y + Math.sin(f.angle + Math.PI) * len;
      ctx.strokeStyle = "rgba(255, 69, 0, 0.9)"; ctx.lineWidth = 18;
      ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(l1x, l1y); ctx.lineTo(l2x, l2y); ctx.stroke();
      ctx.strokeStyle = "#ffff00"; ctx.lineWidth = 6; ctx.stroke();
    } else if (f.type === "ice") {
      ctx.strokeStyle = "rgba(120, 200, 255, 0.9)"; ctx.lineWidth = 14;
      ctx.beginPath();
      ctx.moveTo(f.x - 150, f.y); ctx.lineTo(f.x + 150, f.y);
      ctx.moveTo(f.x, f.y - 150); ctx.lineTo(f.x, f.y + 150); ctx.stroke();
    } else if (f.type === "boom") {
      const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
      g.addColorStop(0, "rgba(255, 240, 150, 0.95)");
      g.addColorStop(0.5, "rgba(255, 140, 0, 0.7)");
      g.addColorStop(1, "rgba(255, 60, 0, 0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
    } else if (f.type === "spark") {
      ctx.fillStyle = f.color; ctx.beginPath(); ctx.arc(f.x, f.y, 3, 0, Math.PI * 2); ctx.fill();
    } else if (f.type === "buh") {
      const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, 16);
      g.addColorStop(0, "#ffffff"); g.addColorStop(0.5, "#ff2288"); g.addColorStop(1, "rgba(120, 0, 40, 0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x, f.y, 16, 0, Math.PI * 2); ctx.fill();
    } else if (f.type === "grass") {
      const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, 12);
      g.addColorStop(0, "#d0ffb0"); g.addColorStop(0.5, "#4ec44e"); g.addColorStop(1, "rgba(30, 100, 30, 0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x, f.y, 12, 0, Math.PI * 2); ctx.fill();
    } else if (f.type === "bolt") {
      ctx.save();
      ctx.shadowColor = "#c060ff"; ctx.shadowBlur = 25;
      ctx.strokeStyle = "rgba(180, 100, 255, 0.95)"; ctx.lineWidth = 6;
      ctx.beginPath();
      const steps = 8;
      const dx = (f.tx - f.x) / steps, dy = (f.ty - f.y) / steps;
      ctx.moveTo(f.x, f.y);
      for (let k = 1; k < steps; k++) {
        ctx.lineTo(f.x + dx * k + (Math.random() - 0.5) * 24, f.y + dy * k + (Math.random() - 0.5) * 24);
      }
      ctx.lineTo(f.tx, f.ty); ctx.stroke();
      ctx.strokeStyle = "#e0ccff"; ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();
    } else if (f.type === "claw") {
      ctx.save();
      ctx.translate(f.x, f.y); ctx.rotate(f.angle);
      ctx.shadowColor = "#c0c8d0"; ctx.shadowBlur = 15;
      ctx.fillStyle = "rgba(150, 160, 180, 0.9)";
      ctx.fillRect(-5, -12, 24, 24);
      ctx.strokeStyle = "#e0e8f0"; ctx.lineWidth = 2;
      ctx.strokeRect(-5, -12, 24, 24);
      ctx.beginPath();
      ctx.moveTo(19, -12); ctx.lineTo(30, -6); ctx.lineTo(19, 0);
      ctx.moveTo(19, 12); ctx.lineTo(30, 6); ctx.lineTo(19, 0);
      ctx.stroke();
      ctx.restore();
    } else if (f.type === "kai") {
      const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, 18);
      g.addColorStop(0, "#f0e0ff"); g.addColorStop(0.5, "#d870ff"); g.addColorStop(1, "rgba(100, 0, 150, 0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x, f.y, 18, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
  for (const b of homeBalls) {
    const glow = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * 2.6);
    glow.addColorStop(0, b.color); glow.addColorStop(0.5, b.color + "55"); glow.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 2.6, 0, Math.PI * 2); ctx.fill();
    const bg = ctx.createRadialGradient(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.1, b.x, b.y, b.r);
    bg.addColorStop(0, "#ffffff"); bg.addColorStop(0.4, b.color); bg.addColorStop(1, b.color);
    ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.85)"; ctx.lineWidth = 2; ctx.stroke();
  if (equippedElement === "hunter") { const t=nearestEnemyTo(player.x,player.y); const a=t?Math.atan2(t.y-player.y,t.x-player.x):0; ctx.save(); ctx.translate(player.x,player.y); ctx.rotate(a); ctx.fillStyle="#49301d"; ctx.fillRect(8,-7,29,14); ctx.fillStyle="#c18a50"; ctx.fillRect(27,-5,13,10); ctx.restore(); }
  }
  const titleY = canvas.height / 2 - 80;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.save();
  ctx.shadowColor = "#9b30ff"; ctx.shadowBlur = 40;
  ctx.fillStyle = "#ffffff"; ctx.font = "bold 84px Arial";
  ctx.fillText("PURPLE CIRCLE", canvas.width / 2, titleY);
  ctx.restore();
  ctx.save();
  ctx.shadowColor = "#ff2288"; ctx.shadowBlur = 20;
  ctx.fillStyle = "#ffccff"; ctx.font = "bold 26px Arial";
  ctx.fillText("survive the waves  ·  roll the gacha  ·  become legend", canvas.width / 2, titleY + 62);
  ctx.restore();

  const btnW = 260, btnH = 76;
  const btnX = canvas.width / 2 - btnW / 2;
  const btnY = canvas.height / 2 + 40;
  const hover = mouse.x >= btnX && mouse.x <= btnX + btnW && mouse.y >= btnY && mouse.y <= btnY + btnH;
  const pulse = 0.5 + 0.5 * Math.sin(homeT * 3);
  ctx.save();
  ctx.shadowColor = "#9b30ff"; ctx.shadowBlur = hover ? 50 : 25 + pulse * 15;
  const bg2 = ctx.createLinearGradient(btnX, btnY, btnX, btnY + btnH);
  bg2.addColorStop(0, hover ? "#b060ff" : "#9b30ff");
  bg2.addColorStop(1, hover ? "#6a10d0" : "#5a10a0");
  ctx.fillStyle = bg2;
  ctx.beginPath();
  const r = 18;
  ctx.moveTo(btnX + r, btnY);
  ctx.lineTo(btnX + btnW - r, btnY);
  ctx.quadraticCurveTo(btnX + btnW, btnY, btnX + btnW, btnY + r);
  ctx.lineTo(btnX + btnW, btnY + btnH - r);
  ctx.quadraticCurveTo(btnX + btnW, btnY + btnH, btnX + btnW - r, btnY + btnH);
  ctx.lineTo(btnX + r, btnY + btnH);
  ctx.quadraticCurveTo(btnX, btnY + btnH, btnX, btnY + btnH - r);
  ctx.lineTo(btnX, btnY + r);
  ctx.quadraticCurveTo(btnX, btnY, btnX + r, btnY);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(btnX + r, btnY);
  ctx.lineTo(btnX + btnW - r, btnY);
  ctx.quadraticCurveTo(btnX + btnW, btnY, btnX + btnW, btnY + r);
  ctx.lineTo(btnX + btnW, btnY + btnH - r);
  ctx.quadraticCurveTo(btnX + btnW, btnY + btnH, btnX + btnW - r, btnY + btnH);
  ctx.lineTo(btnX + r, btnY + btnH);
  ctx.quadraticCurveTo(btnX, btnY + btnH, btnX, btnY + btnH - r);
  ctx.lineTo(btnX, btnY + r);
  ctx.quadraticCurveTo(btnX, btnY, btnX + r, btnY);
  ctx.closePath(); ctx.stroke();
  ctx.fillStyle = "#ffffff"; ctx.font = "bold 36px Arial";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("PLAY", canvas.width / 2, btnY + btnH / 2 + 2);

  // Raid button directly underneath Play.
  const raidY = btnY + btnH + 12, raidH = 58;
  const raidHover = mouse.x >= btnX && mouse.x <= btnX + btnW && mouse.y >= raidY && mouse.y <= raidY + raidH;
  ctx.save();
  ctx.shadowColor = "#00d9ff"; ctx.shadowBlur = raidHover ? 32 : 16;
  const raidGrad = ctx.createLinearGradient(btnX, raidY, btnX, raidY + raidH);
  raidGrad.addColorStop(0, raidHover ? "#26dfff" : "#087fa8");
  raidGrad.addColorStop(1, raidHover ? "#087fa8" : "#064363");
  ctx.fillStyle = raidGrad;
  ctx.beginPath(); ctx.roundRect(btnX, raidY, btnW, raidH, 14); ctx.fill();
  ctx.strokeStyle = "#bdf7ff"; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = "#ffffff"; ctx.font = "bold 27px Arial";
  ctx.fillText("RAIDS", canvas.width / 2, raidY + raidH / 2);
  ctx.restore();
}

function draw() {
  let shakeX = 0, shakeY = 0;
  if (screenShake > 0) { shakeX = (Math.random() - 0.5) * screenShake * 20; shakeY = (Math.random() - 0.5) * screenShake * 20; }
  ctx.save();
  ctx.translate(shakeX, shakeY);

  drawBackground();
  if (isRaidMode) {
    ctx.save();
    ctx.fillStyle = "rgba(0, 45, 70, 0.82)"; ctx.strokeStyle = "#35ddff"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(16, 16, 210, 38, 10); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#d8faff"; ctx.font = "bold 17px Arial"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillText("RAID MODE · 10× ENEMY HP", 27, 35);
    ctx.fillStyle = "#ffe88a"; ctx.font = "bold 15px Arial";
    ctx.fillText("RAID COINS: " + raidCoins, 27, 73);
    ctx.restore();
  }

  // Smoke bombs
  for (const b of smokeBombs) {
    if (b.puffs) for (const p of b.puffs) {
      p.life -= 0.016;
      if (p.life <= 0) { p.life = 1 + Math.random() * 1.0; p.a = Math.random() * Math.PI * 2; p.d = Math.random() * 20; }
    }
    const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.radius);
    g.addColorStop(0, "rgba(200, 200, 200, 0.55)");
    g.addColorStop(1, "rgba(120, 120, 120, 0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2); ctx.fill();
    if (b.puffs) for (const p of b.puffs) {
      const px = b.x + Math.cos(p.a) * p.d, py = b.y + Math.sin(p.a) * p.d;
      const pg = ctx.createRadialGradient(px, py, 0, px, py, p.size);
      pg.addColorStop(0, "rgba(220, 220, 220, 0.55)"); pg.addColorStop(1, "rgba(120, 120, 120, 0)");
      ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(px, py, p.size, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Land mines
  for (const m of landMines) {
    if (m.exploded) continue;
    const blink = 0.5 + 0.5 * Math.sin(m.blink || 0);
    ctx.beginPath(); ctx.arc(m.x, m.y, m.radius + blink * 3, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(60, 60, 60, 0.85)"; ctx.fill();
    ctx.strokeStyle = "#ffcc00"; ctx.lineWidth = 3; ctx.stroke();
    ctx.beginPath(); ctx.arc(m.x, m.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255, 60, 60, " + (0.5 + blink * 0.5) + ")"; ctx.fill();
  }

  // Grass fields
  for (const f of grassFields) {
    const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.radius);
    g.addColorStop(0, "rgba(80, 220, 80, 0.35)");
    g.addColorStop(0.6, "rgba(50, 160, 50, 0.28)");
    g.addColorStop(1, "rgba(30, 100, 30, 0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(120, 240, 120, 0.75)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2); ctx.stroke();
    for (const b of f.blades) {
      const bx = f.x + b.ox, by = f.y + b.oy;
      const sway = Math.sin(b.sway) * 3;
      ctx.strokeStyle = "rgba(120, 230, 100, 0.85)"; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(bx, by);
      ctx.quadraticCurveTo(bx + sway, by - b.h * 0.6, bx + sway * 1.4, by - b.h);
      ctx.stroke();
    }
  }

  // KAI FIELDS (gas)
  for (const f of kaiFields) {
    const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.radius);
    g.addColorStop(0, "rgba(216, 112, 255, 0.40)");
    g.addColorStop(0.5, "rgba(160, 60, 200, 0.30)");
    g.addColorStop(1, "rgba(80, 20, 120, 0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(230, 150, 255, 0.85)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2); ctx.stroke();
    // particles
    for (const p of f.particles) {
      const px = f.x + Math.cos(p.a) * p.d;
      const py = f.y + Math.sin(p.a) * p.d;
      const pa = p.life / 1.2;
      ctx.globalAlpha = pa * 0.7;
      const pg = ctx.createRadialGradient(px, py, 0, px, py, 14);
      pg.addColorStop(0, "rgba(240, 200, 255, 0.9)");
      pg.addColorStop(1, "rgba(180, 80, 220, 0)");
      ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(px, py, 14, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  // Grass shards
  for (const s of grassShards) {
    for (let i = 0; i < s.trail.length; i++) {
      const t = s.trail[i];
      if (t.life <= 0) continue;
      ctx.globalAlpha = (t.life / 0.3) * 0.5;
      ctx.fillStyle = "#4ec44e";
      ctx.beginPath(); ctx.arc(t.x, t.y, s.radius * (t.life / 0.3) * 0.8, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.save();
    ctx.translate(s.x, s.y); ctx.rotate(s.rot);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, s.radius * 1.6);
    g.addColorStop(0, "#e0ffc0"); g.addColorStop(0.5, "#6ee46e"); g.addColorStop(1, "rgba(40, 120, 40, 0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, s.radius * 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-s.radius * 1.2, 0); ctx.lineTo(s.radius * 1.2, -s.radius * 0.4); ctx.lineTo(s.radius * 1.2, s.radius * 0.4);
    ctx.closePath();
    ctx.fillStyle = "#8ef08e"; ctx.fill();
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  }

  // BUH shrine
  for (const shrine of buhShrines) {
    const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 100);
    const g = ctx.createRadialGradient(shrine.x, shrine.y, 0, shrine.x, shrine.y, shrine.radius);
    g.addColorStop(0, "rgba(255, 0, 80, " + (0.55 + pulse * 0.2) + ")");
    g.addColorStop(0.6, "rgba(180, 0, 60, 0.35)"); g.addColorStop(1, "rgba(120, 0, 40, 0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(shrine.x, shrine.y, shrine.radius, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(255, 40, 100, 0.95)"; ctx.lineWidth = 4; ctx.stroke();
  }
  for (const fx of shrineSlashFx) {
    const a = fx.life / fx.maxLife;
    ctx.save(); ctx.globalAlpha = a;
    ctx.strokeStyle = "#ff3366"; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(fx.x - Math.cos(fx.angle) * fx.len, fx.y - Math.sin(fx.angle) * fx.len);
    ctx.lineTo(fx.x + Math.cos(fx.angle) * fx.len, fx.y + Math.sin(fx.angle) * fx.len);
    ctx.stroke();
    ctx.restore();
  }

  // Blizzard field
  for (const field of blizzardFields) {
    const g = ctx.createRadialGradient(field.x, field.y, 0, field.x, field.y, field.radius);
    g.addColorStop(0, "rgba(200, 240, 255, 0.45)");
    g.addColorStop(0.6, "rgba(100, 200, 255, 0.30)");
    g.addColorStop(1, "rgba(60, 120, 200, 0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(field.x, field.y, field.radius, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(150, 230, 255, 0.9)"; ctx.lineWidth = 4; ctx.stroke();
  }

  // Ice spikes
  for (const spike of iceSpikes) {
    const halfW = spike.w / 2, halfH = spike.h / 2;
    ctx.fillStyle = "rgba(120, 200, 255, 0.85)";
    ctx.fillRect(spike.x - halfW, spike.y - halfH / 2, spike.w, spike.h / 2);
    ctx.fillRect(spike.x - halfH / 2, spike.y - halfW, spike.h / 2, spike.w);
    ctx.strokeStyle = "rgba(220, 245, 255, 0.95)"; ctx.lineWidth = 4;
    ctx.strokeRect(spike.x - halfW, spike.y - halfH / 2, spike.w, spike.h / 2);
    ctx.strokeRect(spike.x - halfH / 2, spike.y - halfW, spike.h / 2, spike.w);
  }

  // Fire orbs
  for (const orb of fireOrbs) {
    ctx.save();
    ctx.translate(orb.x, orb.y); ctx.rotate(orb.spinAngle);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, orb.radius);
    g.addColorStop(0, "#ffffaa"); g.addColorStop(0.5, "rgba(255, 100, 0, 0.95)"); g.addColorStop(1, "rgba(255, 60, 0, 0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, orb.radius, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#ffcc00"; ctx.lineWidth = 6; ctx.stroke();
    ctx.restore();
  }

  // BUH bullets
  for (const b of buhBullets) {
    if (b.trail) for (let i = 0; i < b.trail.length; i++) {
      const t = b.trail[i];
      ctx.globalAlpha = (t.life / 0.35) * 0.5;
      ctx.fillStyle = "#ff2288";
      ctx.beginPath(); ctx.arc(t.x, t.y, 10 * (t.life / 0.35), 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.save();
    ctx.translate(b.x, b.y); ctx.rotate(b.spinAngle);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, b.radius * 1.6);
    g.addColorStop(0, "#ffffff"); g.addColorStop(0.4, "#ff2288"); g.addColorStop(1, "rgba(120, 0, 40, 0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, b.radius * 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, b.radius, 0, Math.PI * 2);
    ctx.strokeStyle = "#ff66aa"; ctx.lineWidth = 3; ctx.stroke();
    ctx.restore();
  }

  // KAI ORBS
  for (const b of kaiOrbs) {
    if (b.trail) for (let i = 0; i < b.trail.length; i++) {
      const t = b.trail[i];
      ctx.globalAlpha = (t.life / 0.3) * 0.5;
      ctx.fillStyle = "#d870ff";
      ctx.beginPath(); ctx.arc(t.x, t.y, 8 * (t.life / 0.3), 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.save();
    ctx.translate(b.x, b.y); ctx.rotate(b.spinAngle);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, b.radius * 1.6);
    g.addColorStop(0, "#ffffff"); g.addColorStop(0.4, "#d870ff"); g.addColorStop(1, "rgba(100, 0, 150, 0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, b.radius * 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, b.radius, 0, Math.PI * 2);
    ctx.strokeStyle = "#e0a0ff"; ctx.lineWidth = 3; ctx.stroke();
    ctx.strokeStyle = "rgba(255, 220, 255, 0.9)"; ctx.lineWidth = 2;
    for (let k = 0; k < 3; k++) {
      const a = k * Math.PI * 2 / 3;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * b.radius * 0.5, Math.sin(a) * b.radius * 0.5);
      ctx.lineTo(Math.cos(a) * b.radius * 1.3, Math.sin(a) * b.radius * 1.3);
      ctx.stroke();
    }
    ctx.restore();
  }

  // MECHANIC CLAWS
  for (const c of mechanicClaws) {
    if (c.trail) for (let i = 0; i < c.trail.length; i++) {
      const t = c.trail[i];
      if (t.life <= 0) continue;
      ctx.globalAlpha = (t.life / 0.25) * 0.4;
      ctx.fillStyle = "#a0b0c0";
      ctx.beginPath(); ctx.arc(t.x, t.y, 14 * (t.life / 0.25), 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.save();
    ctx.translate(c.x, c.y); ctx.rotate(c.angle);
    ctx.shadowColor = "#c0c8d0"; ctx.shadowBlur = 20;
    ctx.fillStyle = "rgba(140, 150, 170, 0.95)";
    ctx.strokeStyle = "#e0e8f0"; ctx.lineWidth = 2;
    ctx.fillRect(-16, -12, 30, 24);
    ctx.strokeRect(-16, -12, 30, 24);
    ctx.beginPath();
    ctx.moveTo(14, -12); ctx.lineTo(30, -6); ctx.lineTo(30, -2); ctx.lineTo(14, 0);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(14, 12); ctx.lineTo(30, 6); ctx.lineTo(30, 2); ctx.lineTo(14, 0);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  // MECHANIC SPIN
  if (mechanicSpinActiveTimer > 0) {
    ctx.save();
    ctx.translate(player.x, player.y);
    const armCount = 4;
    for (let k = 0; k < armCount; k++) {
      const a = mechanicSpinAngle + k * Math.PI * 2 / armCount;
      ctx.save();
      ctx.rotate(a);
      ctx.fillStyle = "rgba(140, 150, 170, 0.95)";
      ctx.strokeStyle = "#e0e8f0"; ctx.lineWidth = 2;
      ctx.fillRect(player.radius - 4, -8, 100, 16);
      ctx.strokeRect(player.radius - 4, -8, 100, 16);
      const tipX = player.radius + 96;
      ctx.fillStyle = "rgba(180, 190, 210, 0.95)";
      ctx.beginPath();
      ctx.moveTo(tipX, -16); ctx.lineTo(tipX + 20, -6); ctx.lineTo(tipX + 20, 6); ctx.lineTo(tipX, 16); ctx.lineTo(tipX - 4, 0);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }

  // Lightning bolts
  for (const b of lightningBolts) {
    if (b.trail) for (let i = 0; i < b.trail.length; i++) {
      const t = b.trail[i];
      if (t.life <= 0) continue;
      ctx.globalAlpha = (t.life / 0.3) * 0.5;
      ctx.fillStyle = "#c060ff";
      ctx.beginPath(); ctx.arc(t.x, t.y, 12 * (t.life / 0.3), 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.save();
    ctx.translate(b.x, b.y); ctx.rotate(b.angle);
    ctx.shadowColor = "#c060ff"; ctx.shadowBlur = 25;
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, b.radius * 1.6);
    g.addColorStop(0, "#ffffff"); g.addColorStop(0.4, "#d0a0ff"); g.addColorStop(1, "rgba(100, 0, 200, 0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, b.radius * 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(200, 150, 255, 0.95)"; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-b.radius * 1.4, 0);
    for (let k = 0; k < b.zigzag.length; k++) {
      const px = -b.radius * 1.4 + ((k + 1) / (b.zigzag.length + 1)) * b.radius * 2.8;
      ctx.lineTo(px, b.zigzag[k]);
    }
    ctx.lineTo(b.radius * 1.4, 0);
    ctx.stroke();
    ctx.restore();
  }
  for (const s of lightningStrikes) {
    const a = s.life / s.maxLife;
    ctx.save(); ctx.globalAlpha = a;
    ctx.shadowColor = "#c060ff"; ctx.shadowBlur = 30;
    if (s.isMain) {
      const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.radius);
      g.addColorStop(0, "rgba(255, 255, 255, 0.9)");
      g.addColorStop(0.4, "rgba(180, 100, 255, 0.7)");
      g.addColorStop(1, "rgba(100, 0, 200, 0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2); ctx.fill();
    } else {

    panel(leftPanel, "YOUR ABILITIES", "#c5a8ff");
    panel(rightPanel, "RAID ELEMENTS", "#ff9a62");

    const elems = [
      { key: "sand", name: "SAND", rate: "26%", color: "#c7a72a", unlocked: true },
      { key: "smoke", name: "SMOKE", rate: "17%", color: "#25bce6", unlocked: unlockedElements.smoke },
      { key: "stat", name: "STAT", rate: "14.33%", color: "#20c95c", unlocked: true },
      { key: "grass", name: "GRASS", rate: "14%", color: "#4ec44e", unlocked: unlockedElements.grass },
      { key: "kai", name: "KAI", rate: "11%", color: "#d870ff", unlocked: unlockedElements.kai },
      { key: "bomb", name: "BOMB", rate: "5%", color: "#ffcc00", unlocked: unlockedElements.bomb },
      { key: "flame", name: "FLAME", rate: "5%", color: "#ff653d", unlocked: unlockedElements.flame },
      { key: "lightning", name: "LIGHTNING", rate: "4%", color: "#c060ff", unlocked: unlockedElements.lightning },
      { key: "nickson", name: "NICKSON", rate: "1%", color: "#66f0ff", unlocked: unlockedElements.nickson },
      { key: "mechanic", name: "MECHANIC", rate: "1%", color: "#a0b0c0", unlocked: unlockedElements.mechanic },
      { key: "blizzard", name: "BLIZZARD", rate: "1%", color: "#7ec8ff", unlocked: unlockedElements.blizzard },
      { key: "buh", name: "BUH", rate: "0.5%", color: "#ff2288", unlocked: unlockedElements.buh },
      { key: "hunt", name: "HUNTER", rate: "0.1%", color: "#c18a50", unlocked: unlockedElements.hunter },
      { key: "carter", name: "CARTER", rate: "0.07%", color: "#fff66a", unlocked: unlockedElements.carter },
      { key: "polar", name: "POLAR", rate: "0.05%", color: "#b9f4ff", unlocked: unlockedElements.polar },
      { key: "iceberg", name: "ICEBERG", rate: "0.01%", color: "#d8f7ff", unlocked: unlockedElements.iceberg }
    ];
    const cols = leftPanel.w < 300 ? 2 : 4;
    const innerX = leftPanel.x + 9, innerY = leftPanel.y + 45;
    const innerW = leftPanel.w - 18, innerH = leftPanel.h - 54;
    const cardGap = 7, cardW = (innerW - cardGap * (cols - 1)) / cols;
    const rows = Math.ceil(elems.length / cols), cardH = Math.max(35, (innerH - cardGap * (rows - 1)) / rows);
    for (let i = 0; i < elems.length; i++) {
      const e = elems[i], col = i % cols, row = Math.floor(i / cols);
      const r = { x: innerX + col * (cardW + cardGap), y: innerY + row * (cardH + cardGap), w: cardW, h: cardH };
      const isEq = e.key === "hunt" ? equippedElement === "hunter" : equippedElement === e.key;
      ctx.save();
      ctx.fillStyle = !e.unlocked ? "rgba(10,12,20,0.95)" : (isEq ? e.color : "rgba(44,49,68,0.96)");
      ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 9); ctx.fill();
      ctx.strokeStyle = isEq ? "#fff3b0" : (e.unlocked ? e.color : "#4c5060"); ctx.lineWidth = isEq ? 3 : 1.5; ctx.stroke();
      // Larger fruit/orb icon, with a shine so each selection is easy to spot and tap.
      const rad = Math.min(15, Math.max(9, cardH * 0.24));
      const ix = r.x + (cols === 4 ? 20 : r.w / 2), iy = r.y + Math.min(r.h / 2, 22);
      const orb = ctx.createRadialGradient(ix - rad * .35, iy - rad * .4, 1, ix, iy, rad * 1.3);
      orb.addColorStop(0, e.unlocked ? "#ffffff" : "#666977"); orb.addColorStop(.28, e.unlocked ? e.color : "#444653"); orb.addColorStop(1, "#171923");
      ctx.fillStyle = orb; ctx.beginPath(); ctx.arc(ix, iy, rad, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = e.unlocked ? "rgba(255,255,255,.85)" : "#656979"; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.85)"; ctx.beginPath(); ctx.arc(ix - rad * .32, iy - rad * .36, Math.max(2, rad * .22), 0, Math.PI * 2); ctx.fill();
      const textX = cols === 4 ? r.x + 40 : r.x + r.w / 2;
      const maxTextW = cols === 4 ? r.w - 43 : r.w - 8;
      ctx.fillStyle = e.unlocked ? "#ffffff" : "#8a8c98";
      ctx.font = "bold " + (cardH < 43 ? 9 : 11) + "px Arial";
      ctx.textAlign = "center";
      ctx.fillText(e.name, textX + (cols === 4 ? maxTextW / 2 - 1 : 0), r.y + (cols === 4 ? r.h * .37 : r.h * .58), maxTextW);
      ctx.font = "bold 9px Arial";
      const status = !e.unlocked ? e.rate : (isEq ? "EQUIPPED" : "EQUIP");
      ctx.fillStyle = isEq ? "#fff1a3" : (e.unlocked ? "#c8d0e7" : "#777b89");
      ctx.fillText(status, textX + (cols === 4 ? maxTextW / 2 - 1 : 0), r.y + (cols === 4 ? r.h * .72 : r.h * .82), maxTextW);
      ctx.restore();
    }

    const raidElems = [
      { key: "lava", name: "LAVA", color: "#ff6a24", rate: "99% crate chance", unlocked: unlockedElements.lava, desc: "Magma field + magma-ball form" },
      { key: "volcano", name: "VOLCANO", color: "#ba3a20", rate: "1% crate chance", unlocked: unlockedElements.volcano, desc: "Huge lava zone + homing magma" }
    ];
    const raidGap = 12, raidInnerY = rightPanel.y + 48, raidInnerH = rightPanel.h - 58;
    const raidCardH = Math.max(58, (raidInnerH - raidGap) / 2);
    for (let i = 0; i < raidElems.length; i++) {
      const e = raidElems[i], r = { x: rightPanel.x + 10, y: raidInnerY + i * (raidCardH + raidGap), w: rightPanel.w - 20, h: raidCardH };
      const isEq = equippedElement === e.key;
      ctx.save();
      ctx.fillStyle = !e.unlocked ? "rgba(17,18,27,.96)" : (isEq ? "rgba(105,43,30,.96)" : "rgba(47,35,42,.96)");
      ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 12); ctx.fill();
      ctx.strokeStyle = isEq ? "#fff1b1" : (e.unlocked ? e.color : "#55505a"); ctx.lineWidth = isEq ? 3 : 2; ctx.stroke();
      const rad = Math.min(26, Math.max(16, raidCardH * .22));
      const ix = r.x + 34, iy = r.y + r.h / 2;
      const orb = ctx.createRadialGradient(ix - rad * .3, iy - rad * .4, 1, ix, iy, rad * 1.4);
      orb.addColorStop(0, e.unlocked ? "#fff4d8" : "#66616a"); orb.addColorStop(.25, e.unlocked ? e.color : "#47434b"); orb.addColorStop(1, "#1b171c");
      ctx.fillStyle = orb; ctx.beginPath(); ctx.arc(ix, iy, rad, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = e.unlocked ? "#ffd9a8" : "#77717b"; ctx.lineWidth = 2; ctx.stroke();
      ctx.textAlign = "left"; ctx.fillStyle = e.unlocked ? "#ffffff" : "#99939e";
      ctx.font = "bold 16px Arial"; ctx.fillText(e.name, r.x + 70, r.y + r.h * .31, r.w - 80);
      ctx.font = "11px Arial"; ctx.fillStyle = e.unlocked ? "#e4d4d4" : "#817a85"; ctx.fillText(e.rate, r.x + 70, r.y + r.h * .53, r.w - 80);
      ctx.font = "10px Arial"; ctx.fillStyle = e.unlocked ? "#c6d2e2" : "#817a85"; ctx.fillText(e.unlocked ? e.desc : "Unlock from Raid Crates", r.x + 70, r.y + r.h * .70, r.w - 80);
      ctx.textAlign = "right"; ctx.font = "bold 10px Arial"; ctx.fillStyle = isEq ? "#fff1a3" : (e.unlocked ? "#ffbd8d" : "#77717b");
      ctx.fillText(!e.unlocked ? "LOCKED" : (isEq ? "EQUIPPED" : "CLICK TO EQUIP"), r.x + r.w - 10, r.y + r.h - 12, r.w - 90);
      ctx.restore();
    }

    if (lastRollResult && gachaState === "idle") {
      ctx.fillStyle = "#ffe28a"; ctx.font = "bold 12px Arial";
      ctx.fillText(lastRollResult, W / 2, H - 43, W - 30);
    }
    // Compact return button stays in the top-right corner, clear of the equipment cards.
    const btnX = W - 104, btnY = 12, btnW = 90, btnH = 34;
    ctx.fillStyle = "#42326e"; ctx.beginPath(); ctx.roundRect(btnX, btnY, btnW, btnH, 9); ctx.fill();
    ctx.strokeStyle = "#c7a8ff"; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = "#ffffff"; ctx.font = "bold 13px Arial"; ctx.fillText("GAME", btnX + btnW / 2, btnY + btnH / 2);
  }

  // Death cutscene (drawn on top of everything)
  if (cutscene && cutscene.type === "death") {
    const t = cutscene.timer / cutscene.maxTimer;
    const alpha = Math.min(1, (1 - t) * 2);
    ctx.fillStyle = "rgba(60, 0, 0, " + (alpha * 0.85) + ")";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.shadowColor = "#ff0000"; ctx.shadowBlur = 60;
    ctx.fillStyle = "#ff2222";
    ctx.font = "bold 110px Arial";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("YOU DIED", canvas.width / 2, canvas.height / 2);
    ctx.font = "24px Arial";
    ctx.fillStyle = "#ffaaaa";
    ctx.fillText("returning to lobby...", canvas.width / 2, canvas.height / 2 + 80);
    ctx.restore();
  }
}

function gameLoop(now) {
  const dt = Math.min(Math.max(0, (now - lastTime) / 1000), 0.1);
  lastTime = now;

  // Gacha animation state machine
  if (gachaState !== "idle") {
    gachaTimer -= dt;
    if (gachaState === "shaking" && gachaTimer <= 0) {
      gachaState = "opening";
      gachaTimer = 1.2;
    } else if (gachaState === "opening" && gachaTimer <= 0) {
      gachaState = "reveal";
      gachaTimer = 1.5;
      if (gachaResult) lastRollResult = gachaResult.msg;
    } else if (gachaState === "reveal" && gachaTimer <= 0) {
      gachaState = "idle";
    }
  }

  if (inHome) drawHome();
  else { update(dt); draw(); }
  requestAnimationFrame(gameLoop);
}

window.addEventListener("click", function (e) {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  if (inHome) {
    const btnW = 260, btnH = 76;
    const btnX = canvas.width / 2 - btnW / 2;
    const btnY = canvas.height / 2 + 40;
    const raidY = btnY + btnH + 12, raidH = 58;
    if (mx >= btnX && mx <= btnX + btnW && my >= btnY && my <= btnY + btnH) {
      isRaidMode = false;
      currentWave = normalWave;
      resetGame(true, true);
      inHome = false; homeBalls = []; homeFx = [];
      startWave();
    } else if (mx >= btnX && mx <= btnX + btnW && my >= raidY && my <= raidY + raidH) {
      isRaidMode = true;
      currentWave = raidWave;
      resetGame(true, true);
      inHome = false; homeBalls = []; homeFx = [];
      startWave();
    }
    return;
  }

  if (!isPaused || cutscene) return;

  const btnX = canvas.width - 104, btnY = 12, btnW = 90, btnH = 34;
  if (currentScreen === "raidshop") {
    const crate = { x: canvas.width / 2 - 130, y: canvas.height / 2 + 5, w: 260, h: 55 };
    if (mx >= crate.x && mx <= crate.x + crate.w && my >= crate.y && my <= crate.y + crate.h) { rollRaidCrate(); return; }
    const back = { x: canvas.width / 2 - 90, y: canvas.height - 95, w: 180, h: 48 };
    if (mx >= back.x && mx <= back.x + back.w && my >= back.y && my <= back.y + back.h) currentScreen = "game";
    return;
  }
  if (currentScreen === "gacha" && mx >= canvas.width - 104 && mx <= canvas.width - 14 && my >= 12 && my <= 46) {
    currentScreen = "game"; gachaState = "idle"; return;
  }
  if (currentScreen === "game" && mx >= btnX && mx <= btnX + btnW && my >= btnY && my <= btnY + btnH) {
    currentScreen = "gacha"; gachaState = "idle"; return;
  } else if (currentScreen !== "game" && mx >= btnX && mx <= btnX + btnW && my >= btnY && my <= btnY + btnH) {
    currentScreen = "game"; gachaState = "idle"; return;
  }
  if (currentScreen === "game") {
    const shopY = btnY + btnH + 12;
    if (mx >= btnX && mx <= btnX + btnW && my >= shopY && my <= shopY + btnH) { currentScreen = "raidshop"; return; }
  }
  if (currentScreen === "gacha" && gachaState === "idle") {
    const W = canvas.width, H = canvas.height, cx = W / 2;
    const rollY = 123, rollW = Math.min(190, Math.max(125, W * 0.22)), rollH = 38, rollGap = 10;
    const rollBtn = { x: cx - rollW - rollGap / 2, y: rollY, w: rollW, h: rollH };
    const fastRollBtn = { x: cx + rollGap / 2, y: rollY, w: rollW, h: rollH };
    if (mx >= rollBtn.x && mx <= rollBtn.x + rollBtn.w && my >= rollBtn.y && my <= rollBtn.y + rollBtn.h) { rollGacha(false); return; }
    if (mx >= fastRollBtn.x && mx <= fastRollBtn.x + fastRollBtn.w && my >= fastRollBtn.y && my <= fastRollBtn.y + fastRollBtn.h) {
      if (money < 15) { lastRollResult = "Need at least 15 Money for Fast Roll!"; return; }
      money -= 15; saveGameData(); rollGacha(true); return;
    }
    const panelTop = 193, panelBottom = H - 57, panelH = Math.max(120, panelBottom - panelTop);
    const margin = 12, gapPanels = 10, panelW = (W - margin * 2 - gapPanels) / 2;
    const leftPanel = { x: margin, y: panelTop, w: panelW, h: panelH };
    const rightPanel = { x: margin + panelW + gapPanels, y: panelTop, w: panelW, h: panelH };
    const elems = ["sand", "smoke", "stat", "grass", "kai", "bomb", "flame", "lightning", "nickson", "mechanic", "blizzard", "buh", "hunt", "carter", "polar", "iceberg"];
    const cols = leftPanel.w < 300 ? 2 : 4;
    const innerX = leftPanel.x + 9, innerY = leftPanel.y + 45, innerW = leftPanel.w - 18, innerH = leftPanel.h - 54;
    const cardGap = 7, cardW = (innerW - cardGap * (cols - 1)) / cols, rows = Math.ceil(elems.length / cols);
    const cardH = Math.max(35, (innerH - cardGap * (rows - 1)) / rows);
    if (mx >= leftPanel.x && mx <= leftPanel.x + leftPanel.w && my >= innerY && my <= innerY + innerH) {
      for (let i = 0; i < elems.length; i++) {
        const col = i % cols, row = Math.floor(i / cols);
        const r = { x: innerX + col * (cardW + cardGap), y: innerY + row * (cardH + cardGap), w: cardW, h: cardH };
        if (mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h) {
          const k = elems[i], actual = k === "hunt" ? "hunter" : k;
          if (actual === "sand" || unlockedElements[actual]) { equippedElement = actual; saveGameData(); }
          return;
        }
      }
    }
    const raidElems = ["lava", "volcano"], raidGap = 12, raidInnerY = rightPanel.y + 48, raidInnerH = rightPanel.h - 58;
    const raidCardH = Math.max(58, (raidInnerH - raidGap) / 2);
    if (mx >= rightPanel.x && mx <= rightPanel.x + rightPanel.w && my >= raidInnerY && my <= raidInnerY + raidInnerH) {
      for (let i = 0; i < raidElems.length; i++) {
        const r = { x: rightPanel.x + 10, y: raidInnerY + i * (raidCardH + raidGap), w: rightPanel.w - 20, h: raidCardH };
        if (mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h) {
          const k = raidElems[i];
          if (unlockedElements[k]) { equippedElement = k; saveGameData(); }
          return;
        }
      }
    }
  }
});

window.addEventListener("keydown", function (e) {
  if (inHome) return;
  const k = e.key.toLowerCase();
  if (k === "1") {
    isPaused = !isPaused;
    if (!isPaused) currentScreen = "game";
    e.preventDefault();
    return;
  }
  if (cutscene) return;
  if (k in keys) { keys[k] = true; e.preventDefault(); }
  if (k === "g") { useGAbility(); e.preventDefault(); }
  if (k === "f") { useFAbility(); e.preventDefault(); }
  if (k === "v") { useVBoost(); e.preventDefault(); }
  if (k === " " || k === "spacebar" || e.code === "Space") { useMelee(); e.preventDefault(); }
});

window.addEventListener("keyup", function (e) {
  const k = e.key.toLowerCase();
  if (k in keys) { keys[k] = false; e.preventDefault(); }
});

requestAnimationFrame(gameLoop);
</script>
